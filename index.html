<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WifiPro — Gestion wifi</title>
<meta name="description" content="Gestion des vendeurs, du stock et des ventes de codes wifi.">
<meta name="theme-color" content="#0b7a4c">
<link rel="manifest" href="manifest.json?v=1.7">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="WifiPro">
<link rel="stylesheet" href="styles.css?v=1.7">
</head>
<body class="locked">
<div id="lock" class="lock" hidden>
  <div class="lock-card">
    <span class="brand-logo lock-logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M3.5 9.5a13 13 0 0 1 17 0"/>
        <path d="M6.5 13a8.5 8.5 0 0 1 11 0"/>
        <path d="M9.5 16.4a4 4 0 0 1 5 0"/>
        <circle cx="12" cy="19.4" r="1.2" fill="currentColor" stroke="none"/>
      </svg>
    </span>
    <h1>WifiPro</h1>
    <p class="muted small">Entrez votre code PIN pour accéder à l’application.</p>
    <form id="lockForm">
      <input id="lockPin" class="lock-pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off" placeholder="••••" aria-label="Code PIN">
      <p id="lockError" class="lock-error" hidden>Code incorrect. Réessayez.</p>
      <button class="btn block" type="submit">Déverrouiller</button>
    </form>
    <button type="button" class="lock-forgot" id="forgotPin">Code PIN oublié ?</button>
  </div>
</div>
<div id="gate" class="gate" hidden></div>

<header class="topbar">
  <div class="brand">
    <span class="brand-logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M3.5 9.5a13 13 0 0 1 17 0"/>
        <path d="M6.5 13a8.5 8.5 0 0 1 11 0"/>
        <path d="M9.5 16.4a4 4 0 0 1 5 0"/>
        <circle cx="12" cy="19.4" r="1.2" fill="currentColor" stroke="none"/>
      </svg>
    </span>
    <div class="brand-text">
      <strong>WifiPro</strong>
      <span id="shopSub">Gestion vendeurs &amp; codes</span>
    </div>
  </div>
  <button class="btn ghost sm" id="installBtn" type="button" hidden>Installer</button>
</header>

<main id="app" class="app" aria-live="polite"></main>

<nav class="bottomnav" aria-label="Navigation principale">
  <a href="#/home" data-nav="home">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
    <span>Accueil</span>
  </a>
  <a href="#/vendors" data-nav="vendors">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6.5 6.5-6.5s6.5 2.9 6.5 6.5"/><path d="M16 5a3.5 3.5 0 0 1 0 7"/><path d="M18 14.2c2.1.8 3.5 2.8 3.5 5.3"/></svg>
    <span>Vendeurs</span>
  </a>
  <a href="#/sales" data-nav="sales">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h3l2.5 12h11l2-8H6"/><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/></svg>
    <span>Ventes</span>
  </a>
  <a href="#/stock" data-nav="stock">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7l9-4 9 4-9 4-9-4Z"/><path d="M3 7v10l9 4 9-4V7"/><path d="M12 11v10"/></svg>
    <span>Stock</span>
  </a>
  <a href="#/more" data-nav="more">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/></svg>
    <span>Plus</span>
  </a>
</nav>

<dialog id="sheet" class="sheet"></dialog>
<div id="toast" class="toast-wrap" aria-live="polite"></div>

<script src="app.js?v=1.7"></script>
</body>
</html>
